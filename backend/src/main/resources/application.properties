spring.application.name=mindcare-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/mindcare
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
server.servlet.context-path=/api/v1
server.port=8080

# JWT validation (Option A: Supabase Auth)
auth.jwt.issuer-uri=${AUTH_JWT_ISSUER_URI:https://example.supabase.co/auth/v1}
auth.jwt.audience=${AUTH_JWT_AUDIENCE:authenticated}
auth.jwt.jwks-uri=${AUTH_JWT_JWKS_URI:https://example.supabase.co/auth/v1/.well-known/jwks.json}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
